services:
  db:
    image: postgres:16-alpine
    environment: { POSTGRES_USER: portfolio, POSTGRES_PASSWORD: portfolio, POSTGRES_DB: portfolio }
    ports: ["5432:5432"]
    volumes: [pgdata:/var/lib/postgresql/data]
    healthcheck: { test: ["CMD-SHELL", "pg_isready -U portfolio"], interval: 5s, retries: 10 }
  redis:
    image: redis:7-alpine
    ports: ["6379:6379"]
  api:
    build: ./apps/api
    env_file: [.env]
    environment:
      DATABASE_URL: postgresql://portfolio:portfolio@db:5432/portfolio
      DIRECT_URL: postgresql://portfolio:portfolio@db:5432/portfolio
      REDIS_URL: redis://redis:6379
      CORS_ORIGIN: ${SITE_URL:-http://localhost:3000}
      BACKEND_URL: ${BACKEND_URL:-http://localhost:4000}
      NODE_ENV: production
    depends_on: { db: { condition: service_healthy }, redis: { condition: service_started } }
    ports: ["4000:4000"]
    volumes: [uploads:/app/uploads]
  web:
    build:
      context: ./apps/web
      args: { API_URL: "http://api:4000", NEXT_PUBLIC_SITE_URL: "${SITE_URL:-http://localhost:3000}" }
    depends_on: [api]
    ports: ["3000:3000"]
volumes: { pgdata: {}, uploads: {} }
